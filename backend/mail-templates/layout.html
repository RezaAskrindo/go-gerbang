<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>

  <body style="margin:0;padding:0;background:#f5f5f5">

    <table width="100%">
      <tr>
        <td align="center">

          <table width="600" style="background:white;border-radius:8px;padding:30px">

            <tr>
              <td align="center">

              {{ if .Logo }}
              <img src="{{ .Logo }}" width="120">
              {{ end }}

              <h2>{{ .Title }}</h2>

              {{ template "content" . }}

              <hr>

              <p style="font-size:12px;color:#777">
              {{ .Footer }}
              </p>

              </td>
            </tr>

          </table>

        </td>
      </tr>
    </table>

  </body>

</html>
